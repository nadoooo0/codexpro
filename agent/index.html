<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자율 작업 · GPT-6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#19252d;font:16px/1.65 system-ui,sans-serif}main{max-width:1060px;margin:45px auto;padding:0 22px}h1{font-size:30px;margin:0}h2{font-size:20px;margin-top:0}.sub{color:#596873}section{background:white;padding:25px;border-radius:16px;margin:22px 0;border:1px solid #dce3e8}label{display:block;margin:14px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #c6d1d9;border-radius:8px;padding:10px;background:white}textarea{min-height:130px;resize:vertical}button{border:0;border-radius:8px;padding:9px 18px;background:#126c68;color:white;cursor:pointer;margin:10px 8px 0 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e7eef1;color:#233c47}.row{display:flex;gap:18px}.row>*{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;background:#f5f7f9;padding:16px;border-radius:8px;max-height:500px;overflow:auto}.task{border-top:1px solid #e0e6eb;padding:15px 0}.task-title{font-weight:650}.badge{background:#e3efec;border-radius:20px;padding:3px 10px;margin-left:10px;font-size:13px}.error{color:#963c33}a{color:#126c68}small{color:#65747c}[hidden]{display:none!important}@media(max-width:640px){.row{display:block}main{margin-top:25px}}
</style>
<main><h1>자율 작업</h1><p class="sub">선택한 GPT-6 모델이 기존 a·b·c 계정으로 파일 수정과 검증을 이어갑니다. 창을 닫아도 접수된 작업은 계속됩니다.</p>
<section id="login"><h2>기존 웹 암호로 접속</h2><form id="login-form"><label for="password">접속 암호</label><input id="password" type="password" autocomplete="current-password" required><button>접속</button></form><p id="login-error" class="error" role="status"></p></section>
<div id="app" hidden><section><h2>새 작업</h2><form id="task-form">
<div class="row"><div><label for="account">사용할 계정</label><select id="account"><option value="a">a</option><option value="b">b</option><option value="c">c</option></select></div><div><label for="cwd">VM 작업 폴더</label><input id="cwd" placeholder="/home/azureuser/프로젝트" required></div></div>
<label for="model">모델</label><select id="model"><option value="gpt-6-astra-wm">Astra · Heavy (최대 추론)</option><option value="gpt-6-pro">Pro</option></select><label for="goal">완료할 작업</label><textarea id="goal" placeholder="무엇을 만들거나 수정할지, 완료됐는지 어떻게 확인할지 적어주세요." required></textarea>
<button id="submit">자율 작업 시작</button><button type="button" class="secondary" id="accounts-button">계정 연결 확인</button>
<p id="submit-status" role="status"></p><small>관련 VM 작업은 중간 승인 없이 진행합니다. 실제 로그인이나 사용자 결정이 필요한 경우 작업 기록에 남습니다.</small>
</form><pre id="accounts" hidden></pre></section>
<section><h2>작업 기록</h2><button id="refresh" class="secondary">새로 고침</button><div id="tasks"></div></section>
<section id="detail" hidden><h2>작업 상세</h2><pre id="detail-text"></pre><button id="events-button" class="secondary">실행 근거 보기</button><label for="followup">이어갈 때 전달할 추가 정보</label><input id="followup" placeholder="필요한 정보 또는 확인한 실제 결과"><button id="resume" class="secondary">기존 작업 이어가기</button><button id="cancel" class="secondary">이 작업 중지</button><pre id="events" hidden></pre></section></div></main>
<script>
const $=id=>document.getElementById(id);let selected=null,refreshing=false,pending=JSON.parse(sessionStorage.getItem("agent_submission")||"null");
const states={queued:'접수됨',running:'실행 중',completed:'검증 후 완료',needs_input:'확인 필요',cancel_requested:'중지 처리 중',cancelled:'중지됨'};
async function api(path,body,key){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(key?{'Idempotency-Key':key}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const d=await r.json();if(r.status===401){$('login').hidden=false;$('app').hidden=true}if(!r.ok)throw Error(d.error||JSON.stringify(d));return d}
async function refresh(){if(refreshing)return;refreshing=true;try{const d=await api('v1/tasks');$('login').hidden=true;$('app').hidden=false;$('tasks').replaceChildren();for(const t of d.tasks){const box=document.createElement('div');box.className='task';const title=document.createElement('div');title.className='task-title';title.textContent=`${t.account} · ${t.spec.goal.slice(0,110)}`;const status=document.createElement('span');status.className='badge';status.textContent=states[t.state]||t.state;title.append(status);const info=document.createElement('small');info.textContent=t.cwd;const btn=document.createElement('button');btn.className='secondary';btn.textContent='상세 보기';btn.onclick=()=>detail(t.id);box.append(title,info,document.createElement('br'),btn);$('tasks').append(box)}if(selected)await detail(selected)}finally{refreshing=false}}
async function detail(id){selected=id;const t=await api('v1/tasks/'+id);$('detail').hidden=false;$('detail-text').textContent=JSON.stringify({상태:states[t.state]||t.state,단계:t.phase,계정:t.account,선택모델:t.model,실제응답모델:t.actual_models,추론강도:t.effort,작업폴더:t.cwd,요청:t.spec.goal,결과:t.summary,검증:t.verification,오류:t.error,다음행동:t.next_action,대화:t.conversation_id?'https://chatgpt.com/c/'+t.conversation_id:null,작업번호:t.id},null,2);$('resume').disabled=t.state!=='needs_input';$('cancel').disabled=['completed','cancelled'].includes(t.state)}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('password').value});$('password').value='';$('login-error').textContent='';await refresh()}catch(e){$('login-error').textContent=e.message}};
$('task-form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const body={account:$('account').value,cwd:$('cwd').value,goal:$('goal').value,model:$('model').value,...($('model').value==='gpt-6-astra-wm'?{effort:'max'}:{})};const serialized=JSON.stringify(body);if(pending&&pending.serialized!==serialized&&pending.confirmed)pending=null;if(pending&&pending.serialized!==serialized)throw Error('직전 요청의 수신 여부가 불명확합니다. 먼저 작업 기록을 새로 고쳐 확인하세요.');if(!pending)pending={serialized,key:'web-'+crypto.randomUUID()};sessionStorage.setItem('agent_submission',JSON.stringify(pending));const d=await api('v1/tasks',body,pending.key);pending.confirmed=true;sessionStorage.setItem('agent_submission',JSON.stringify(pending));$('submit-status').textContent='접수했습니다. 아래 기록에서 실행 상태를 확인할 수 있습니다.';await refresh();await detail(d.task.id)}catch(e){$('submit-status').textContent=e.message+' 같은 입력으로 다시 누르면 동일 작업 번호를 사용합니다.'}finally{$('submit').disabled=false}};
$('accounts-button').onclick=async()=>{try{$('accounts').hidden=false;$('accounts').textContent=JSON.stringify(await api('v1/accounts?model='+$('model').value),null,2)}catch(e){$('accounts').textContent=e.message}};
$('refresh').onclick=()=>refresh().catch(e=>$('submit-status').textContent=e.message);
$('events-button').onclick=async()=>{try{$('events').hidden=false;$('events').textContent=JSON.stringify(await api('v1/tasks/'+selected+'/events'),null,2)}catch(e){$('events').textContent=e.message}};
$('resume').onclick=async()=>{try{await api('v1/tasks/'+selected+'/resume',{message:$('followup').value});await refresh()}catch(e){$('submit-status').textContent=e.message}};
$('cancel').onclick=async()=>{try{await api('v1/tasks/'+selected+'/cancel',{});await refresh()}catch(e){$('submit-status').textContent=e.message}};
if(pending){const old=JSON.parse(pending.serialized);$('account').value=old.account;$('cwd').value=old.cwd;$('goal').value=old.goal;$('model').value=old.model;}refresh().catch(()=>{});setInterval(()=>{if(!$('app').hidden)refresh().catch(()=>{})},5000);
</script></html>
